# 用語集（付録A の元データ）。本文中で [[用語]] と書くと、ここに書いた説明がホバー／タップで表示されます。
# 説明は1〜2文。言い換えを増やさず、この資料での呼び方に固定します。
JOIN: 2つ以上の表を、指定した列の値が一致する行どうしで横に並べる操作。「結合」とも呼ぶ。
"NULL": 値が「不明」または「存在しない」ことを表す特別な状態。0 や空文字とは別物。
主キー: 表の中で1行を必ず1つに特定できる列（または列の組）。重複も NULL も許されない。英語では PRIMARY KEY。
外部キー: 別の表の主キーを指す列。存在しない相手を指せないように、PostgreSQL が確認する。英語では FOREIGN KEY。
UNIQUE制約: 指定した列に、同じ値が2回入らないようにする決まり。
中間テーブル: 多対多の関係（記事とタグなど）を表すために、両方の id の組だけを持つ表。
粒度: 表の1行が何を表すか。「1記事」「1回の取得」など。英語では grain。
正規化: 同じ事実を1か所にだけ書くように、表を分ける考え方。ここでは「表記をそろえる」の意味でも使う（URL の正規化）。
インデックス: 検索を速くするために、列の値を並べ替えて持っておく仕組み。本の索引にあたる。
ハッシュ: データの中身から計算した、指紋のような短い値。中身が同じなら同じ値になる。
